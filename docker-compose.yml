# ClipPipeline: Telegram -> n8n -> clipbot -> OpenShorts -> Telegram approval,
# plus the web dashboard (served by clipbot on :8090).
#
#   docker compose up -d                       # core stack
#   COMPOSE_PROFILES=tunnel in .env            # + a cloudflared container (setup.sh sets it; skip if the host runs cloudflared)
#   COMPOSE_PROFILES=publish in .env           # + Postiz, the scheduler that posts approved clips (combine: tunnel,publish)
#   docker compose --profile dashboard up -d   # + OpenShorts web dashboard on :5175
#
# Reachable from the internet (through Cloudflare Tunnel routes): n8n's /webhook/ paths,
# and Postiz on its own hostname when publishing is on. Everything else stays on this
# server's LAN or the internal Docker network.

name: clippipeline

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      POSTGRES_DB: n8n
    # Also holds Postiz's and Temporal's databases when publishing is on; Temporal keeps many connections.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: imports the ClipBot credentials + workflow into n8n on first start.
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-2.43.7}
    restart: "no"
    entrypoint: ["/bin/sh", "/import/import.sh"]
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run scripts/init-env.sh first}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      # Used only by the import script to fill in the credentials it creates.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLIPBOT_TOKEN: ${CLIPBOT_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.43.7}
    restart: unless-stopped
    ports:
      - "${N8N_BIND:-0.0.0.0}:5678:5678"   # editor on the LAN: http://<server-ip>:5678
    environment:
      <<: *n8n-env
      TELEGRAM_BOT_TOKEN: ""                # not needed at runtime; lives in the n8n credential
      # Public URL Telegram calls (the Cloudflare Tunnel hostname).
      N8N_WEBHOOK_URL: https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}/
      N8N_PROXY_HOPS: "1"
      # The editor is opened over plain http on the LAN.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"        # hours (14 days)
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully

  openshorts:
    build:
      context: ./vendor/openshorts            # fetched by scripts/fetch-openshorts.sh
    image: clippipeline/openshorts:local
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Optional: moment picking on an OpenAI-compatible server instead of Gemini.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # CPU-only box: small int8 Whisper, x264 (OpenShorts has no VAAPI path), one job at a time.
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      FFMPEG_ENCODER: x264
      MAX_CONCURRENT_JOBS: ${OPENSHORTS_CONCURRENT_JOBS:-1}
      # Stream VODs are often < 720p or flagged low quality; don't stop to ask.
      QUALITY_GATE_MIN_HEIGHT: "0"
      RATE_LIMIT_ENABLED: "0"
      # clipbot's Director sends sections that hug the clips it chose (openshorts/patches).
      MIN_SOURCE_SECONDS: "15"
      YOUTUBE_COOKIES: ${YOUTUBE_COOKIES:-}
      # How long OpenShorts keeps a job's source and work files. The clip editor can extend or
      # reframe a clip only while they're kept.
      JOB_RETENTION_SECONDS: ${OPENSHORTS_RETENTION_SECONDS:-86400}
    volumes:
      - openshorts_output:/app/output
      - openshorts_uploads:/app/uploads
      - openshorts_models:/app/.cache/huggingface
    expose:
      - "8000"

  clipbot:
    build: ./clipbot
    image: clippipeline/clipbot:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      OPENSHORTS_URL: http://openshorts:8000
      N8N_EVENTS_URL: http://n8n:5678/webhook/clipbot-events
      CLIPBOT_TOKEN: ${CLIPBOT_TOKEN:?run scripts/init-env.sh first}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      TARGET_CLIPS: ${TARGET_CLIPS:-3}
      CLIP_MIN_SECONDS: ${CLIP_MIN_SECONDS:-15}
      CLIP_MAX_SECONDS: ${CLIP_MAX_SECONDS:-60}
      OPENSHORTS_LAYOUTS: ${OPENSHORTS_LAYOUTS:-auto}
      AUTO_HOOK: ${AUTO_HOOK:-true}
      CAPTIONS: ${CAPTIONS:-true}
      MAX_RANGE_MINUTES: ${MAX_RANGE_MINUTES:-90}
      AUTO_RETRY: ${AUTO_RETRY:-true}
      # /scan and /watch
      SCAN_TOP: ${SCAN_TOP:-10}
      SCAN_CANDIDATES: ${SCAN_CANDIDATES:-15}
      SCAN_BEFORE_SECONDS: ${SCAN_BEFORE_SECONDS:-120}
      SCAN_AFTER_SECONDS: ${SCAN_AFTER_SECONDS:-60}
      SCAN_CLIPS_PER_MOMENT: ${SCAN_CLIPS_PER_MOMENT:-1}
      SCAN_AUDIO: ${SCAN_AUDIO:-true}
      SCAN_HYPE_WORDS: ${SCAN_HYPE_WORDS:-}
      WATCH_INTERVAL_MINUTES: ${WATCH_INTERVAL_MINUTES:-15}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      # web dashboard
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      TZ: ${TZ:-UTC}
      # publishing through Postiz (off while POSTIZ_API_KEY is empty)
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      POSTIZ_HOSTNAME: ${POSTIZ_HOSTNAME:-}
      PUBLISH_SLOTS: ${PUBLISH_SLOTS:-12:00,17:00,21:00}
      PUBLISH_TO: ${PUBLISH_TO:-youtube,tiktok,instagram}
      TIKTOK_POST_MODE: ${TIKTOK_POST_MODE:-UPLOAD}
      YOUTUBE_VISIBILITY: ${YOUTUBE_VISIBILITY:-public}
      # Gemini: the Director (watches moments and ranges, picks the exact clips, writes their copy),
      # hook ideas and moment sound effects. The free tier is enough.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DIRECTOR: ${DIRECTOR:-true}
      DIRECTOR_MODEL: ${DIRECTOR_MODEL:-}
    volumes:
      - ./data:/data                              # pending/ approved/ rejected/ live here
      - openshorts_output:/openshorts-output:ro   # read-only: sizes for the Storage page;
      - openshorts_uploads:/openshorts-uploads:ro #   the janitor does the deleting
    ports:
      - "${N8N_BIND:-0.0.0.0}:${DASHBOARD_PORT:-8090}:8080"   # dashboard on the LAN: http://<server-ip>:8090
    depends_on:
      - openshorts

  # Deletes OpenShorts' files of finished jobs when you ask (🗑 in Telegram, the Storage page).
  # clipbot can't: they belong to OpenShorts' own user. No network, nothing else to do.
  janitor:
    image: busybox:${BUSYBOX_VERSION:-1.38.0}
    restart: unless-stopped
    network_mode: none
    command: ["sh", "/janitor.sh"]
    environment:
      PURGE: /data/purge
    volumes:
      - ./scripts/janitor.sh:/janitor.sh:ro
      - ./data:/data
      - openshorts_output:/output
      - openshorts_uploads:/uploads

  # ---- publishing (COMPOSE_PROFILES=publish): Postiz + what it needs ----------------------------
  # Postiz posts approved clips to YouTube / TikTok / Instagram. It needs its own public hostname
  # (POSTIZ_HOSTNAME, a Cloudflare Tunnel route to http://localhost:4007): the platforms' login
  # pages send you back there, and Instagram fetches the video from it.
  postiz:
    profiles: ["publish"]
    image: ghcr.io/gitroomhq/postiz-app:${POSTIZ_VERSION:-v2.25.0}
    restart: unless-stopped
    environment:
      MAIN_URL: https://${POSTIZ_HOSTNAME:-postiz.invalid}
      FRONTEND_URL: https://${POSTIZ_HOSTNAME:-postiz.invalid}
      NEXT_PUBLIC_BACKEND_URL: https://${POSTIZ_HOSTNAME:-postiz.invalid}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-}
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD}@postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "true"      # only the first account (yours) can sign up
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: "300"                  # clipbot's posts per hour through the public API
      TZ: ${TZ:-UTC}
      # Your developer apps (README → Publishing). Empty = that platform's button does nothing.
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    volumes:
      - postiz_config:/config
      - postiz_uploads:/uploads
    ports:
      - "127.0.0.1:${POSTIZ_PORT:-4007}:5000"   # for the host's cloudflared; open it through its hostname
    # Healthy once the backend answers, not just the web pages (they come up first and fail with a
    # 500 on /auth until then): the same call the sign-up page makes.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/auth/can-register',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    depends_on:
      postiz-db:
        condition: service_completed_successfully
      postiz-redis:
        condition: service_healthy
      temporal-attrs:
        condition: service_completed_successfully

  # One-shot: checks the settings Postiz needs and creates its database in the shared Postgres.
  postiz-db:
    profiles: ["publish"]
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTIZ_HOSTNAME: ${POSTIZ_HOSTNAME:-}
      POSTIZ_JWT_SECRET: ${POSTIZ_JWT_SECRET:-}
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$POSTIZ_HOSTNAME" ] || { echo "Set POSTIZ_HOSTNAME in .env (bash setup.sh --publish does)"; exit 1; }
        [ -n "$$POSTIZ_JWT_SECRET" ] || { echo "Set POSTIZ_JWT_SECRET in .env (bash setup.sh --publish does)"; exit 1; }
        psql -h postgres -U n8n -d n8n -tAc "SELECT 1 FROM pg_database WHERE datname='postiz'" | grep -q 1 \
          || psql -h postgres -U n8n -d n8n -c 'CREATE DATABASE postiz'
    depends_on:
      postgres:
        condition: service_healthy

  postiz-redis:
    profiles: ["publish"]
    image: redis:${REDIS_VERSION:-7.4.11-alpine}
    restart: unless-stopped
    volumes:
      - postiz_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postiz runs scheduled posts as Temporal workflows. Search lives in Postgres here, so the
  # Elasticsearch container from Postiz's own compose file isn't needed.
  temporal:
    profiles: ["publish"]
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.28.1}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: n8n
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      # Search lives in Postgres, which has room for 3 Text search attributes. Postiz needs 2, so
      # Temporal's sample ones (2 of them Text) stay out; see temporal-attrs.
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
    volumes:
      - ./postiz/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot, before Postiz: waits for Temporal's default namespace, then frees the Text search
  # attribute slots Temporal's samples took on installs made before SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES
  # (Postiz's backend won't start otherwise: "cannot have more than 3 search attribute of type Text").
  temporal-attrs:
    profiles: ["publish"]
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.28.1}
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        attrs() { temporal operator search-attribute "$$@" --address temporal:7233 --namespace default; }
        tries=0
        until attrs list >/dev/null 2>&1; do
          tries=$$((tries + 1))
          [ "$$tries" -lt 60 ] || { echo "Temporal's default namespace never showed up"; exit 1; }
          sleep 2
        done
        for name in CustomStringField CustomTextField; do
          if attrs list | grep -qw "$$name"; then
            attrs remove --name "$$name" --yes && echo "Removed Temporal's sample search attribute $$name"
          fi
        done
        echo "Temporal is ready for Postiz"
    depends_on:
      temporal:
        condition: service_healthy

  # Optional: only for servers without their own cloudflared. Its tunnel route points at http://n8n:5678.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.0}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - n8n

  # Optional OpenShorts web UI (Vite dev server) for re-editing clips by hand.
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./vendor/openshorts/dashboard
      target: dev
    image: clippipeline/openshorts-dashboard:local
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://openshorts:8000
    ports:
      - "${N8N_BIND:-0.0.0.0}:5175:5173"
    depends_on:
      - openshorts

volumes:
  postgres_data:
  n8n_data:
  openshorts_output:
  openshorts_uploads:
  openshorts_models:
  postiz_config:
  postiz_uploads:
  postiz_redis:
